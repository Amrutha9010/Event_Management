spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Ammu@2005}

# Load the shared SQL schema from the repository's database folder before Hibernate starts.
# The database itself (ems_db) must exist before the JDBC connection can be opened.
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/ems_schema.sql

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

app.jwt.secret=${JWT_SECRET:emsLocalDevelopmentSigningKeyForJwtTokensUseAtLeastThirtyTwoChars}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.notifications.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
